<section class="hero" #heroSection>
  <!-- Ambient blurred duplicate of the hero photo -->
  <div class="hero__bg" [style.backgroundImage]="'url(' + bgImage + ')'"></div>

  <!-- Foreground portrait -->
  <div class="hero__photo-wrap">
    <img
      class="hero__photo"
      [src]="mainImage"
      [alt]="name + ' — ' + role"
      #heroPhoto
    />
  </div>

  <!-- Three.js bokeh / particle overlay -->
  <app-cinematic-layer class="hero__particles" [playing]="isPlaying"></app-cinematic-layer>

  <!-- Cinematic readability overlays -->
  <div class="hero__glow hero__glow--amber"></div>
  <div class="hero__glow hero__glow--blue"></div>
  <div class="hero__scrim hero__scrim--side"></div>
  <div class="hero__scrim hero__scrim--bottom"></div>
  <div class="hero__vignette"></div>

  <!-- HUD-style status line, echoes the sci-fi dashboard in the photo -->
  <div class="hud">
    <span class="hud__dot"></span>
    <span>SYSTEM ONLINE — AVAILABLE FOR WORK</span>
  </div>

  <!-- Glassmorphism playback controls -->
  <div class="controls">
    <button
      type="button"
      class="glass-btn"
      (click)="togglePlay()"
      [attr.aria-label]="isPlaying ? 'Pause ambient motion' : 'Resume ambient motion'"
    >
      <svg *ngIf="!isPlaying" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <svg *ngIf="isPlaying" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
    </button>

    <!-- <button
      type="button"
      class="glass-btn"
      (click)="toggleMute()"
      [attr.aria-label]="isMuted ? 'Unmute' : 'Mute'"
    >
      <svg *ngIf="isMuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
      <svg *ngIf="!isMuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
    </button> -->
  </div>

  <div class="sound-hint" #soundHint *ngIf="showSoundHint">CLICK TO ENABLE SOUND</div>

  <!-- Portfolio content -->
  <div class="hero__content">
    <p class="eyebrow" #eyebrow>{{ tagline }}</p>

    <h1 class="name">
      <span class="name__line">
        <span #nameLine1 style="translate: none;
    rotate: none;
    scale: none;
    transform: translate(0px, 0%);">{{ firstName }}</span>
      </span>
      <span class="name__line name__line--accent">
        <span #nameLine2>{{ lastName }}</span>
      </span>
    </h1>

    <p class="subtitle" #subtitle>{{ subtitleText }}</p>

    <div class="role-chips" #roleChips>
      <div class="role-chip" *ngFor="let chip of roleChips_data; let i = index">
        <b>{{ (i + 1) | number: '2.0' }}</b>{{ chip }}
      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <button type="button" class="scroll-indicator" #scrollIndicator (click)="scrollToNext()" aria-label="Scroll to next section">
    <span class="scroll-indicator__label">Scroll</span>
    <span class="scroll-indicator__line">
      <span class="scroll-indicator__pulse"></span>
    </span>
  </button>
</section>
